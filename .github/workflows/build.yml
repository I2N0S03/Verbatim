name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk Verbatim.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Verbatim
          path: Verbatim.apk
      - name: Publish a release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" Verbatim.apk --title "Verbatim build ${{ github.run_number }}" --notes "Download Verbatim.apk and open it on your phone to install."
